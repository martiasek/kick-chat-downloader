name: Build Windows exe

on:
  push:
    tags: ["v*"]        # nový release: git tag v1.0.0 && git push --tags
  workflow_dispatch:     # nebo ručně v záložce Actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write    # kvůli nahrání .exe do Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --onefile --name KickChatDownloader
          --add-data "templates;templates" --collect-all curl_cffi launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: KickChatDownloader-windows
          path: dist/KickChatDownloader.exe
      - name: Připojit .exe k Release (jen u tagu)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KickChatDownloader.exe
